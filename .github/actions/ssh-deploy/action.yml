name: SSH deploy
description: >
  Fetch and reset the theme working copy on a remote server over SSH.

# Defined once here, used twice by deploy.yml: an attempt, and a retry that runs
# as its own job.
#
# The retry has to be a separate job rather than a second step, because every
# step of a job runs on one runner VM behind one egress IP. When a deploy fails
# on `dial tcp ... i/o timeout` the host is dropping that IP's packets, and a
# step-level retry is dropped along with it. A new job gets a new VM and a new
# IP, which is exactly why re-running a failed deploy by hand has always worked.
#
# Secrets cannot be handed to a composite action as secrets, only as inputs, so
# the caller passes their values in and GitHub goes on masking them in the log.

inputs:
  host:
    description: SSH host.
    required: true
  username:
    description: SSH user.
    required: true
  key:
    description: SSH private key.
    required: true
  port:
    description: SSH port.
    required: true
  theme-path:
    description: Absolute path to the theme's git working copy on the server.
    required: true
  git-remote:
    description: Remote to fetch from on the server.
    required: true
  git-branch:
    description: Branch to reset the server to.
    required: true

runs:
  using: composite
  steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ inputs.host }}
        username: ${{ inputs.username }}
        key: ${{ inputs.key }}
        port: ${{ inputs.port }}
        # How long to wait for the TCP connection, not for the script. The
        # action's default is 30s, which is not a considered figure, and a
        # deploy on 2026-08-08 failed on a bare `dial tcp i/o timeout` that
        # cleared on an identical re-run. 60s costs nothing on a healthy
        # connection and takes the marginal case off the table. It does not
        # mask a real outage: an unreachable host still fails, just later.
        timeout: 60s
        # envs passes these into the remote shell, so the values are never
        # spliced into the script text.
        envs: THEME_PATH,GIT_REMOTE,GIT_BRANCH
        script: |
          set -e

          # Expand a leading ~ ourselves. The shell only expands a tilde it
          # parses as syntax - a literal ~ in the script text. One arriving
          # inside a variable is just a character, and "$THEME_PATH" would
          # hand git a directory named "~" that cannot exist. Shared hosts
          # hand out paths in ~/ form constantly, so handle it rather than
          # relying on everyone remembering to write it absolute.
          case "$THEME_PATH" in
            "~") THEME_PATH="$HOME" ;;
            "~/"*) THEME_PATH="$HOME/${THEME_PATH#"~/"}" ;;
          esac

          # Say which of the two things is wrong, rather than letting git
          # report a bare "not a git repository" for both.
          if [ ! -d "$THEME_PATH" ]; then
            echo "No such directory on the server: $THEME_PATH" >&2
            echo "Check the DEV_THEME_PATH variable." >&2
            exit 1
          fi
          if [ ! -e "$THEME_PATH/.git" ]; then
            echo "$THEME_PATH exists but is not a git working copy." >&2
            echo "Deploying is 'git pull' there, so it has to be a clone." >&2
            exit 1
          fi

          # Fetch and reset rather than pull. A pull is a merge, and a merge
          # refuses to run whenever a tracked file has been edited on the
          # server - including by the deploy it is trying to replace. That
          # turns any stray server-side edit into a blocked deploy that needs
          # someone to SSH in and clear it by hand.
          #
          # This discards server-side edits every time, which is the point: a
          # deploy target mirrors the branch, it is not somewhere to work.
          # Anything edited directly on dev is lost on the next deploy, and
          # should be committed here instead.
          #
          # Untracked files are deliberately left alone. `git clean` would
          # take them too, and there is no way to tell a leftover from
          # something the site needs from up here.
          echo "Deploying $GIT_REMOTE/$GIT_BRANCH into $THEME_PATH"
          git -C "$THEME_PATH" fetch "$GIT_REMOTE" "$GIT_BRANCH"

          # Name what is being discarded, so a lost server-side edit shows up
          # in the deploy log rather than being a silent surprise later.
          if [ -n "$(git -C "$THEME_PATH" status --porcelain)" ]; then
            echo "Discarding local changes on the server:"
            git -C "$THEME_PATH" status --short
          fi

          git -C "$THEME_PATH" reset --hard FETCH_HEAD

          # Purge the page caches, or logged-out visitors keep getting the
          # pre-deploy HTML. Page caches skip logged-in users, so a stale
          # deploy looks fine to whoever checks it from wp-admin. They purge
          # themselves when content is saved, not when theme files change
          # under them, so a git deploy has to ask.
          #
          # A site can have more than one layer - dev runs W3 Total Cache
          # on top of SiteGround's nginx cache - so flush every one that is
          # present rather than stopping at the first. Flushing a cache
          # that turns out to be empty costs nothing.
          #
          # The theme sits at <root>/wp-content/themes/<name>, three levels
          # below the WordPress root that WP-CLI needs.
          #
          # A failed purge only warns. The code is already live, and failing
          # here would send the retry job off to redeploy something that
          # deployed fine.
          WP_ROOT="$(cd "$THEME_PATH/../../.." && pwd)"
          if ! command -v wp >/dev/null 2>&1; then
            echo "::warning::WP-CLI not found on the server; caches not purged."
          else
            wpc() { wp --path="$WP_ROOT" "$@"; }
            if wpc plugin is-active w3-total-cache 2>/dev/null; then
              wpc w3-total-cache flush all \
                && echo "Flushed W3 Total Cache." \
                || echo "::warning::W3 Total Cache is active but did not flush."
            fi
            if wpc plugin is-active sg-cachepress 2>/dev/null; then
              wpc sg purge \
                && echo "Purged the SiteGround cache." \
                || echo "::warning::SiteGround Optimizer is active but did not purge."
            fi
            wpc cache flush || echo "::warning::Object cache did not flush."
          fi
      env:
        THEME_PATH: ${{ inputs.theme-path }}
        GIT_REMOTE: ${{ inputs.git-remote }}
        GIT_BRANCH: ${{ inputs.git-branch }}
