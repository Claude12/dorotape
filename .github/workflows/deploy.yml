name: Deploy on version bump

# Deploys dev when the Version line in style.css changes on main.
#
# This workflow owns exactly one job: getting code onto dev. It does not talk to
# monday. It publishes a small "deploy-outcome" artifact saying what it did, and
# monday-tracking.yml reads that afterwards via workflow_run. Keeping the split
# means a monday outage, a bad token or a broken column id cannot turn a working
# deploy red.

on:
  push:
    branches:
      - main
    paths:
      - 'style.css'

permissions:
  contents: read

jobs:
  check-version-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # Full history: the tracking workflow walks deployed-dev..HEAD to find
          # every ticket in this deploy, and a shallow clone cannot do that.
          fetch-depth: 0

      - name: Check if version bumped
        id: version_check
        run: |
          set -euo pipefail

          # github.event.before is the real previous tip of main. HEAD~1 is only
          # the same thing when the push was a single commit or a merge commit -
          # it silently misses the bump when several commits land at once.
          PREV_REV="${{ github.event.before }}"
          if ! git rev-parse --verify --quiet "${PREV_REV}^{commit}" >/dev/null 2>&1; then
            echo "before-ref ${PREV_REV} unavailable (force push or first push); using HEAD~1"
            PREV_REV="HEAD~1"
          fi

          PREV=$(git show "${PREV_REV}:style.css" 2>/dev/null | grep -m1 '^Version:' | awk '{print $2}' || true)
          CURR=$(grep -m1 '^Version:' style.css | awk '{print $2}' || true)

          if [ -z "${CURR}" ]; then
            echo "::error::No 'Version:' line found in style.css. The theme header format changed - deploy gating is broken until this is fixed."
            exit 1
          fi

          echo "Previous: ${PREV:-<none>} -> Current: ${CURR}"
          echo "version=${CURR}" >> "$GITHUB_OUTPUT"
          echo "prev_version=${PREV:-}" >> "$GITHUB_OUTPUT"

          if [ "${PREV:-}" != "${CURR}" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      # Nothing about this repo's own paths is baked into the workflow, so the
      # same file works on the next project. An unset variable stops the deploy
      # here with a name to fix, rather than running `git -C "" pull` on the
      # server and leaving you to work out what happened.
      - name: Require a deploy target
        if: steps.version_check.outputs.bumped == 'true'
        env:
          THEME_PATH: ${{ vars.DEV_THEME_PATH }}
        run: |
          if [ -z "${THEME_PATH}" ]; then
            echo "::error::Repository variable DEV_THEME_PATH is not set. It is the absolute path to the theme's git working copy on the dev server, e.g. ~/www/example.dev/public_html/wp-content/themes/mytheme"
            exit 1
          fi
          echo "Deploy target: ${THEME_PATH}"

      - name: Deploy via SSH
        id: deploy
        if: steps.version_check.outputs.bumped == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # envs passes these into the remote shell, so the values are never
          # spliced into the script text.
          envs: THEME_PATH,GIT_REMOTE,GIT_BRANCH
          script: |
            set -e
            git -C "$THEME_PATH" pull "$GIT_REMOTE" "$GIT_BRANCH"
        env:
          THEME_PATH: ${{ vars.DEV_THEME_PATH }}
          GIT_REMOTE: ${{ vars.DEV_GIT_REMOTE || 'origin' }}
          GIT_BRANCH: ${{ vars.DEV_GIT_BRANCH || 'main' }}

      # workflow_run hands the next workflow a conclusion, not step outputs. Without
      # this file, "succeeded and deployed" and "succeeded but the version was not
      # bumped" look identical downstream - and every push to main would mark
      # tickets Deployed.
      - name: Record outcome
        if: always()
        run: |
          if [ "${{ steps.version_check.outcome }}" != "success" ]; then
            OUTCOME=failed
          elif [ "${{ steps.version_check.outputs.bumped }}" != "true" ]; then
            OUTCOME=skipped
          elif [ "${{ steps.deploy.outcome }}" = "success" ]; then
            OUTCOME=deployed
          else
            OUTCOME=failed
          fi

          mkdir -p deploy-outcome
          {
            echo "outcome=${OUTCOME}"
            echo "sha=${{ github.sha }}"
            echo "version=${{ steps.version_check.outputs.version }}"
          } > deploy-outcome/outcome.env

          echo "Deploy outcome: ${OUTCOME}"
          cat deploy-outcome/outcome.env >> "$GITHUB_STEP_SUMMARY"

      - name: Upload outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-outcome
          path: deploy-outcome/outcome.env
          retention-days: 7
