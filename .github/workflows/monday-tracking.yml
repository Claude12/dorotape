name: monday tracking

# Writes pipeline state into the monday dev board. Nothing here can affect a
# deploy: the deploy runs in deploy.yml and this workflow only ever reacts to it
# afterwards, via workflow_run.
#
# Until .github/monday-config.json has real board ids and MONDAY_TOKEN exists,
# every job here logs "SKIP" and exits 0 rather than failing. Wiring the board up
# is what switches it on - nothing in this file needs to change.
#
# You set Completed by hand. No job in this workflow ever writes that label.

on:
  create:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  workflow_run:
    workflows: ["Deploy on version bump"]
    types: [completed]

  # Progress has to be recalculated on a clock, not only after a deploy, because
  # the one input the pipeline cannot observe is Completed - you set that by hand
  # on the board, and nothing in git happens when you do. Without this the bar
  # would sit stale for days after a round of sign-offs.
  #
  # Two things to know about schedules: they only ever run on the default branch,
  # and GitHub disables them after 60 days with no commits to the repo. A quiet
  # project stops reporting progress silently, which is the failure mode to look
  # for if the bar goes stale.
  schedule:
    - cron: '17 5 * * 1-5'   # 05:17 UTC = 07:17 SAST, before anyone starts

  workflow_dispatch:
    inputs:
      force:
        description: 'Post an update even if the figures have not changed'
        type: boolean
        default: false

permissions:
  contents: write      # move the deployed-dev marker tag
  actions: read        # read the deploy run's outcome artifact
  pull-requests: read

# Set once for every job: the comments monday-sync writes link to the dev site,
# and the site check needs to know what to check. A repo variable rather than
# committed config, so a copy of this repo for another project cannot inherit
# the previous project's URL.
env:
  DEV_SITE_URL: ${{ vars.DEV_SITE_URL }}

# Serialise monday writes. Two runs racing on the deployed-dev tag would make
# the "everything since the last deploy" range wrong for one of them.
concurrency:
  group: monday-tracking
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- branch push
  branch-created:
    if: github.event_name == 'create' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      # Full history so the branch's own commits can be read for refs. A branch
      # pushed with commits already on it is the normal case, and a shallow
      # clone cannot see past the tip.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Branch names go in through the environment, never interpolated into the
      # run: block. A branch may legally be named with backticks or $(...), and
      # ${{ }} pastes it into the shell as source text, not as a string.
      - name: Mark In progress
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          BRANCH: ${{ github.event.ref }}
          BASE: origin/${{ github.event.repository.default_branch }}
        run: |
          node .github/scripts/monday-sync.js branch-created \
            --branch "$BRANCH" --commits-from "$BASE"

  # ------------------------------------------------------------ pull requests
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history so the PR's commit messages can be read for refs - a ref
      # added in a commit after the branch was named is the common case.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A draft PR is not up for review yet, so it should not move the ticket.
      #
      # PR_TITLE and PR_BODY are attacker-controlled on a fork PR and go in
      # through the environment for the same reason branch names do. They are
      # only ever scanned for the ref pattern, never executed.
      - name: Mark Code review
        if: |
          github.event.action != 'closed' &&
          github.event.pull_request.draft == false
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node .github/scripts/monday-sync.js pr-opened \
            --branch "$BRANCH" --pr-url "$PR_URL" \
            --pr-number "$PR_NUMBER" --pr-author "$PR_AUTHOR" \
            --title "$PR_TITLE" --text "$PR_BODY" --commits-from "$BASE"

      # Closed-without-merge deliberately does nothing: the ticket is still live
      # work, and silently moving it would lose that.
      - name: Mark Merged
        if: |
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node .github/scripts/monday-sync.js pr-merged \
            --branch "$BRANCH" --pr-url "$PR_URL" \
            --pr-number "$PR_NUMBER" --pr-author "$PR_AUTHOR" \
            --title "$PR_TITLE" --text "$PR_BODY" --commits-from "$BASE"

  # ----------------------------------------------------------------- deploy
  deploy-tracking:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.outcome.outputs.outcome }}
      sha: ${{ steps.outcome.outputs.sha }}
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      # workflow_run's github.sha is the default branch head, NOT the commit that
      # deployed. Everything downstream depends on pinning to head_sha here.
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download deploy outcome
        id: fetch_outcome
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: deploy-outcome
          path: deploy-outcome
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve what the deploy actually did
        id: outcome
        run: |
          set -euo pipefail
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"

          if [ -f deploy-outcome/outcome.env ]; then
            # shellcheck disable=SC1091
            . deploy-outcome/outcome.env
            echo "Artifact says: outcome=${outcome} sha=${sha}"
          elif [ "$CONCLUSION" = "failure" ]; then
            # Died before it could write the file - a failure is still a failure.
            outcome=failed
            sha="${{ github.event.workflow_run.head_sha }}"
            echo "No artifact and the run failed; treating as a failed deploy."
          else
            # Cannot confirm anything shipped. Marking tickets Deployed on a guess
            # is worse than staying quiet, so stay quiet.
            outcome=unknown
            sha="${{ github.event.workflow_run.head_sha }}"
            echo "::warning::No outcome artifact and conclusion was '${CONCLUSION}'. Not touching the board."
          fi

          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # Every ticket merged since the last successful dev deploy, not just the
      # one that happened to bump the version.
      - name: Collect tickets in this deploy
        id: refs
        if: steps.outcome.outputs.outcome == 'deployed' || steps.outcome.outputs.outcome == 'failed'
        run: |
          set -euo pipefail
          # No "|| true" on purpose: if the range cannot be computed, this step
          # fails, and the write and tag-advance steps below skip with it. Better
          # to report nothing and retry next deploy than to move the marker past
          # tickets that were never recorded.
          # Bootstrap is worth shouting about. With no marker the range collapses
          # to the single bump commit, which normally carries no ticket ref - so
          # the deploy reports nothing, nothing fails, and the marker is then
          # planted at HEAD, hiding every ticket behind it. Survivable once, but
          # only if you know it happened.
          HAVE_MARKER=1
          if ! git rev-parse --verify --quiet 'deployed-dev^{commit}' >/dev/null; then
            HAVE_MARKER=0
            echo "::warning::No deployed-dev marker yet, so only ${{ steps.outcome.outputs.sha }} was examined and tickets merged before it will NOT be reported. The marker is about to be planted here. To report them, push the deployed-dev tag at the commit before those merges and deploy again."
          fi

          REFS=$(node .github/scripts/monday-sync.js refs-from-range \
                   --from deployed-dev \
                   --to "${{ steps.outcome.outputs.sha }}" | tr '\n' ' ' | xargs)
          echo "Tickets in range: ${REFS:-<none>}"
          echo "refs=${REFS}" >> "$GITHUB_OUTPUT"

          # Empty refs is the pipeline's only silent failure: every step below is
          # gated on refs != '', so they all skip and the run still goes green.
          # A range that shipped real commits but named no ticket is nearly always
          # a mistake - a squash or rebase merge that dropped the branch name, or
          # a commit subject written without one. Say so on the run itself; there
          # is no other moment where anyone would notice.
          if [ "$HAVE_MARKER" = "1" ] && [ -z "$REFS" ]; then
            COUNT=$(git rev-list --count 'deployed-dev..${{ steps.outcome.outputs.sha }}')
            if [ "$COUNT" -gt 0 ]; then
              echo "::warning::Deploy shipped $COUNT commit(s) but no DR ref was found in any of them, so no ticket was updated. Check the commit subjects in deployed-dev..${{ steps.outcome.outputs.sha }} - a squash or rebase merge drops the branch name, so the ref has to be in the subject itself. The deployed-dev marker still advances, so these commits will not be re-examined on the next deploy."
            fi
          fi

      - name: Mark Deployed to dev
        if: steps.outcome.outputs.outcome == 'deployed' && steps.refs.outputs.refs != ''
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: |
          node .github/scripts/monday-sync.js deployed \
            --refs "${{ steps.refs.outputs.refs }}" \
            --commit "${{ steps.outcome.outputs.sha }}" \
            --run-url "${{ github.event.workflow_run.html_url }}"

      - name: Mark Blocked - deploy failed
        if: steps.outcome.outputs.outcome == 'failed' && steps.refs.outputs.refs != ''
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: |
          node .github/scripts/monday-sync.js blocked \
            --refs "${{ steps.refs.outputs.refs }}" \
            --stage deploy \
            --run-url "${{ github.event.workflow_run.html_url }}"

      # Advance the marker only after monday agrees. success() covers that: a
      # failed write makes it false, so the tag stays put and the next deploy
      # re-reports the range rather than losing it.
      #
      # What success() does NOT catch is the first deploy. With no marker the
      # range collapses to the bump commit alone, that commit carries no ticket
      # ref, the write SKIPS - which leaves success() true - and the tag is then
      # planted at HEAD, hiding every ticket behind it for good. Nothing failed,
      # so nothing complained. The warning in the refs step above is the only
      # thing standing between that and a silent hole, which is why it is a
      # ::warning:: and not an echo.
      - name: Advance deployed-dev marker
        if: success() && steps.outcome.outputs.outcome == 'deployed'
        run: |
          set -euo pipefail
          git tag -f deployed-dev "${{ steps.outcome.outputs.sha }}"
          git push -f origin refs/tags/deployed-dev
          echo "deployed-dev now at ${{ steps.outcome.outputs.sha }}"

  # ------------------------------------------------------------- site checks
  # Runs against dev after a deploy actually landed. Pass moves the tickets to
  # QA; fail moves them to Blocked with a comment that says plainly that the
  # code IS live and may be broken - which is a different problem from a deploy
  # that never shipped.
  #
  # Like everything else in this file, it cannot affect the deploy: the deploy
  # already finished in another workflow before this one starts.
  site-check:
    needs: deploy-tracking
    if: >-
      needs.deploy-tracking.outputs.outcome == 'deployed' &&
      needs.deploy-tracking.outputs.refs != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.deploy-tracking.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No fallback URL on purpose. A default here would mean a copy of this repo
      # with DEV_SITE_URL unset checks the ORIGINAL project's site and writes
      # "checks passed" to the new project's board - green, and meaningless.
      - name: Require a site to check
        run: |
          if [ -z "${DEV_SITE_URL}" ]; then
            echo "::error::Repository variable DEV_SITE_URL is not set. It must be the full URL of the dev site, e.g. https://example.dev - note it is a VARIABLE, not a secret."
            exit 1
          fi
          echo "Checking: ${DEV_SITE_URL}"

      # Prove dev is serving the code that was just deployed, before anything is
      # checked or even discovered. Three runs in August 2026 came back red on the
      # front page alone and passed on a re-run of the identical commit, because
      # the checks reached dev before dev was serving the new theme. See
      # tests/wait-for-deploy.js. Needs no npm install, so it runs before one.
      - name: Wait for dev to serve this deploy
        id: settle
        continue-on-error: true
        working-directory: tests
        env:
          THEME_PATH: ${{ vars.DEV_THEME_PATH }}
        run: |
          set -euo pipefail

          # The theme's directory name on the server is also its directory name
          # under wp-content/themes, which is what the style.css URL needs. The
          # workspace basename is the REPO name and can differ, so it is not used.
          SLUG=$(basename "${THEME_PATH%/}")
          if [ -z "${THEME_PATH}" ] || [ "$SLUG" = "." ] || [ "$SLUG" = "/" ]; then
            echo "::error::Cannot work out the theme directory name from DEV_THEME_PATH ('${THEME_PATH}'). It is the absolute path to the theme on the dev server."
            exit 1
          fi

          VERSION=$(grep -m1 '^Version:' ../style.css | awk '{print $2}')
          if [ -z "${VERSION}" ]; then
            echo "::error::No 'Version:' line in style.css, so there is no way to tell which code dev is serving."
            exit 1
          fi

          THEME_SLUG="$SLUG" EXPECT_VERSION="$VERSION" node wait-for-deploy.js

      - name: Install
        if: steps.settle.outcome == 'success'
        working-directory: tests
        run: npm ci

      - name: Install browser
        if: steps.settle.outcome == 'success'
        working-directory: tests
        run: npx playwright install --with-deps chromium

      # continue-on-error, because a failing check is a result to report, not a
      # broken workflow. The outcome is read back on the next line.
      - name: Run checks
        id: check
        if: steps.settle.outcome == 'success'
        continue-on-error: true
        working-directory: tests
        # No SITE_URL here: discover.js falls back to DEV_SITE_URL, which the
        # workflow already sets. Two names for one value is how they drift apart.
        run: npm test

      - name: Summarise
        id: summary
        if: steps.check.outcome != 'skipped'
        working-directory: tests
        run: |
          {
            echo 'text<<SUMMARY_EOF'
            node summarise.js
            echo 'SUMMARY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Keep the report
        if: steps.check.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: site-check-report
          path: |
            tests/.artifacts/report
            tests/.artifacts/results.json
            tests/.artifacts/plan.json
          retention-days: 14

      # The summary goes in through the environment, never interpolated into the
      # run: block. It is generated text containing backticks and quotes, and
      # ${{ }} inside a shell command would hand those straight to bash.
      - name: Mark QA - checks passed
        if: steps.check.outcome == 'success'
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          SUMMARY: ${{ steps.summary.outputs.text }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REFS: ${{ needs.deploy-tracking.outputs.refs }}
        run: |
          node .github/scripts/monday-sync.js checks-passed \
            --refs "$REFS" --run-url "$RUN_URL" --summary "$SUMMARY"

      # 'failure', not '!= success'. When the wait above times out the checks are
      # skipped rather than failed, and this message is the wrong one for that: it
      # says the code is live on dev and may be broken, which is the opposite of
      # what happened. That case is the next step.
      - name: Mark Blocked - checks failed
        if: steps.check.outcome == 'failure'
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          SUMMARY: ${{ steps.summary.outputs.text }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REFS: ${{ needs.deploy-tracking.outputs.refs }}
        run: |
          node .github/scripts/monday-sync.js blocked \
            --refs "$REFS" --stage checks --run-url "$RUN_URL" --detail "$SUMMARY"

      # --stage deploy, even though deploy.yml reported success. From the board's
      # point of view the code did not arrive: the site is still serving the old
      # version, and that stage's wording says so and marks the checks not run,
      # rather than claiming something was verified.
      - name: Mark Blocked - deploy never appeared on dev
        if: steps.settle.outcome != 'success'
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REFS: ${{ needs.deploy-tracking.outputs.refs }}
        run: |
          node .github/scripts/monday-sync.js blocked \
            --refs "$REFS" --stage deploy --run-url "$RUN_URL" \
            --detail "The deploy step reported success, but dev never began serving this theme version within the wait, so no checks were run. Nothing here says the code is faulty. Look at whether the deploy reached the server and whether a cache is still holding the previous theme."

  # ---------------------------------------------------------------- progress
  # Recalculate the weighted progress bar and write it onto the board.
  #
  # Runs last on a deploy, after site-check has moved tickets to QA or Blocked,
  # so it reports the state this run left behind rather than the state it found.
  # !cancelled() rather than success(): both jobs above are SKIPPED on a
  # scheduled run, and a skipped need would otherwise take this job with it.
  #
  # Nothing here is on the critical path. It reads the board, does arithmetic
  # and writes one item - it cannot affect a deploy, and it cannot affect the
  # ticket writes above, which have already happened by the time it starts.
  progress:
    needs: [site-check]
    if: >-
      !cancelled() && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Skips with a message until the board has a Size column, so a project
      # that has not set this up yet does not collect a nightly red X.
      - name: Recalculate progress
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          # Empty on every trigger except workflow_dispatch, where "inputs" exists.
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "${FORCE:-}" = "true" ]; then
            node .github/scripts/monday-sync.js progress --force
          else
            node .github/scripts/monday-sync.js progress
          fi
